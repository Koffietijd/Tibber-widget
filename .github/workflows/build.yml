name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - name: Render dashboard previews
        id: previews
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: steps.previews.outcome == 'success'
        with:
          name: dashboard-previews
          path: app/build/previews/*.png
      - name: Print small previews (base64)
        if: steps.previews.outcome == 'success'
        run: |
          for f in app/build/previews-small/*.jpg; do
            echo "===BEGIN $(basename $f)==="
            base64 -w 2000 "$f"
            echo "===END==="
          done
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TibberWidget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TibberWidget-apk
          path: TibberWidget.apk
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tibber Widget (laatste build)
          body: "Automatisch gebouwd vanaf ${{ github.ref_name }} (${{ github.sha }}). Download TibberWidget.apk en installeer op je telefoon."
          prerelease: false
          make_latest: true
          files: TibberWidget.apk
